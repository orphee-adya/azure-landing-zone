# Workflow réutilisable : plan (identité lecture seule) puis, si demandé et
# si le plan contient des changements, apply du plan SAUVEGARDÉ après
# approbation manuelle (environnement alz-apply).
name: terraform-stage

on:
  workflow_call:
    inputs:
      stage:
        description: "Dossier sous stages/ (ex : 30-connectivity)"
        type: string
        required: true
      apply:
        description: "Appliquer après approbation si le plan contient des changements"
        type: boolean
        default: false
      terraform_version:
        type: string
        default: "~1.13.0" # figer la version exacte validée
    outputs:
      has_changes:
        description: "true si le plan contient des changements"
        value: ${{ jobs.plan.outputs.has_changes }}

permissions:
  contents: read
  id-token: write      # jeton OIDC -> Entra ID (aucun secret)
  pull-requests: write # commentaire de plan sur la PR

env:
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_ARGS_init: "-input=false"
  TFSTATE_SUBSCRIPTION_ID: ${{ vars.TFSTATE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  STAGE: ${{ inputs.stage }}

jobs:
  plan:
    name: plan · ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: alz-plan
    timeout-minutes: 60
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # identité "plan" (Reader)
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        shell: bash
        working-directory: stages/${{ inputs.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="subscription_id=${TFSTATE_SUBSCRIPTION_ID}" \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${STAGE}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file=../../config/common.tfvars \
            -lock-timeout=10m \
            -detailed-exitcode \
            -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan a échoué pour ${STAGE}"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          terraform show -no-color tfplan > plan.txt
          # Résumé "+ ~ -" pour la synthèse
          terraform show -no-color tfplan | grep -E '^Plan:|^No changes' | tail -1 > plan-summary.txt || true

      - name: Job summary
        run: |
          {
            echo "## Plan \`${STAGE}\`"
            echo ""
            echo "**$(cat plan-summary.txt)**"
            echo ""
            echo "<details><summary>Détail du plan</summary>"
            echo ""
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commentaire sur la PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_FILE: stages/${{ inputs.stage }}/plan.txt
          SUMMARY_FILE: stages/${{ inputs.stage }}/plan-summary.txt
        with:
          script: |
            const fs = require('fs');
            const stage = process.env.STAGE;
            const marker = `<!-- tf-plan:${stage} -->`;
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8').trim();
            const max = 60000;
            if (plan.length > max) plan = plan.substring(0, max) + '\n... (tronqué, voir le résumé du job)';
            const body = `${marker}
            ### Terraform plan · \`${stage}\`
            **${summary}** — run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            <details><summary>Afficher le plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Publier le plan (pour l'apply)
        if: inputs.apply && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stages/${{ inputs.stage }}/tfplan
            stages/${{ inputs.stage }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: error

  apply:
    name: apply · ${{ inputs.stage }}
    needs: plan
    if: inputs.apply && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: alz-apply # approbation requise + branches protégées uniquement
    timeout-minutes: 120
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # identité "apply"
    defaults:
      run:
        shell: bash
        working-directory: stages/${{ inputs.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Récupérer le plan approuvé
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: stages/${{ inputs.stage }}

      - name: Terraform init
        run: |
          terraform init \
            -lockfile=readonly \
            -backend-config="subscription_id=${TFSTATE_SUBSCRIPTION_ID}" \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${STAGE}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      # Un plan devenu obsolète (état modifié entre-temps) est refusé par Terraform
      - name: Terraform apply (plan sauvegardé)
        run: terraform apply -lock-timeout=10m -auto-approve tfplan
